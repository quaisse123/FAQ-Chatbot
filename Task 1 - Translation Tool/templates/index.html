<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Translator — Professional Translation Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-section">
          <div class="logo-icon">🌐</div>
          <h1>AI Translator</h1>
        </div>
        <div class="header-stats">
          <span class="stat-item">
            ⏱️ <span id="charCount">0</span> characters
          </span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <div class="translator-wrapper">
        <!-- Source Panel -->
        <div class="panel source-panel">
          <div class="panel-header">
            <label class="language-label">From</label>
            <select id="sourceLang" class="language-select">
              {% for code, name in languages.items() %}
              <option value="{{ code }}">{{ name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="panel-body">
            <textarea 
              id="sourceText" 
              class="input-field" 
              placeholder="Enter text to translate...

Paste any content, select languages, and get instant translations."
              spellcheck="true"></textarea>
            <div class="input-footer">
              <span class="char-indicator"><span id="charCountLive">0</span>/5000</span>
            </div>
          </div>
        </div>

        <!-- Swap Button -->
        <div class="swap-container">
          <button id="swapBtn" class="swap-btn" title="Swap source & target languages">
            ⇅
          </button>
        </div>

        <!-- Target Panel -->
        <div class="panel target-panel">
          <div class="panel-header">
            <label class="language-label">To</label>
            <select id="targetLang" class="language-select">
              {% for code, name in languages.items() %}
              <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="panel-body">
            <div id="resultBox" class="output-field">
              <div id="translatedText" class="translated-content">
                <span class="placeholder-text">Translation will appear here...</span>
              </div>
            </div>
            <div class="output-footer">
              <span id="status" class="status-indicator"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <button id="translateBtn" class="btn btn-primary btn-lg">
          ✨ Translate
        </button>
        <div class="secondary-actions">
          <button id="copyBtn" class="btn btn-secondary" title="Copy translation">
            📋 Copy
          </button>
          <button id="speakBtn" class="btn btn-secondary" title="Text-to-speech">
            🔊 Listen
          </button>
          <button id="clearBtn" class="btn btn-secondary" title="Clear all">
            🗑️ Clear
          </button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-content">
        <p class="privacy-notice">🔒 Secure: Text sent only to MyMemory (Lingva fallback). No storage, no tracking.</p>
        <span class="version">v1.0 • Powered by MyMemory + Lingva</span>
      </div>
    </footer>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
